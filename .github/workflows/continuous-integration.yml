name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, reopened ]

env:
  fail-fast: true

jobs:
  checks:
    name: Code Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none
          tools: cs2pr

      - name: Install Composer Dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: "highest"
          composer-options: "--prefer-stable --optimize-autoloader --no-progress --no-interaction"

      - name: Run Composer Audit
        run: composer audit --abandoned=report

      - name: Run Composer Dependency Analyser
        run: vendor/bin/composer-dependency-analyser

      - name: Run Composer Require Checker
        run: vendor/bin/composer-require-checker

      - name: Run Composer Normalize
        run: composer normalize --dry-run --indent-size 2 --indent-style space --no-check-lock --no-update-lock

      - name: Run PHP CS Fixer
        run: vendor/bin/php-cs-fixer check --using-cache=no --config php-cs-fixer.php.dist

      - name: Run PHP_CodeSniffer
        id: php-code-sniffer
        run: vendor/bin/phpcs --standard=phpcs.xml.dist --report-checkstyle=./phpcs-report.xml --colors src/ tests/

      - name: Show PHP_CodeSniffer results in PR
        if: ${{ always() && steps.php-code-sniffer.outcome == 'failure' }}
        run: cs2pr ./phpcs-report.xml

      - name: Run Rector
        run: vendor/bin/rector process --ansi --dry-run --config rector-ci.php src/ tests/

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

      - name: Run Psalm
        run: vendor/bin/psalm --no-cache

  build:
    needs: checks
    name: PHPUnit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dependencies:
          - lowest
          - highest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: pcov

      - name: Install Composer Dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: "--prefer-stable --optimize-autoloader --no-progress --no-interaction"

      - name: Run PHPUnit
        run: |
          php -d zend.assertions=1 \
          vendor/bin/phpunit \
            --colors=always \
            --testdox \
            --testdox-summary \
            --log-junit tests/.results/tests-junit.xml \
            --coverage-clover tests/.results/tests-clover.xml

      - name: Upload coverage files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.job }}-8.4-${{ matrix.dependencies }}-coverage
          include-hidden-files: true
          path: tests/.results/

  sonarcloud:
    needs: build
    name: SonarCloud Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage files
        uses: actions/download-artifact@v8
        with:
          name: build-8.4-highest-coverage
          path: tests/.results/

      - name: Fix Code Coverage Paths
        working-directory: tests/.results/
        run: |
          sed -i 's@'$GITHUB_WORKSPACE'@/github/workspace/@g' tests-clover.xml
          sed -i 's@'$GITHUB_WORKSPACE'@/github/workspace/@g' tests-junit.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
